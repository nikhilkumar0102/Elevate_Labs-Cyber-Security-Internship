<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Chat Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h2 id="username">Welcome, {{ username }}!</h2>

    <div class="container">
        <div class="sidebar">
            <div class="room-list">
                <h3>Rooms</h3>
                {% for room in rooms %}
                <div class="room-item" onclick="joinRoom('{{ room | e }}')">
                    {{ room | e }}
                </div>
                {% endfor %}
            </div>

            <div class="user-list">
                <h3>Online Users</h3>
                <div id="active-users"></div>
            </div>
        </div>

        <div class="main-chat">
            <div id="chat"></div>

            <div class="input-area">
                <input type="text" id="message" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
                <input type="file" id="file-upload" style="display: none;" accept="image/*,audio/*">
                <button onclick="document.getElementById('file-upload').click()">Upload</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="{{ url_for('static', filename='chat.js') }}"></script>
    <script>
        document.getElementById('file-upload').addEventListener('change', uploadFile);
    </script>
</body>
</html>
