<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Choose Your Nickname</title>
		<link
			rel="stylesheet"
			href="{{ url_for('static', filename='styles.css') }}"
		/>
		<style>
			/* Re-using styles from login.html for consistency */
			body {
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
				background-color: #f5f6fa;
			}
			.login-container {
				background: white;
				padding: 40px;
				border-radius: 10px;
				box-shadow: var(--shadow);
				text-align: center;
				width: 300px;
			}
			.login-container h1 {
				color: var(--primary);
				margin-bottom: 10px;
			}
			.login-container p {
				margin-bottom: 20px;
				color: var(--secondary);
			}
			.login-container input {
				width: 100%;
				padding: 12px;
				margin-bottom: 20px;
				border: 1px solid #ddd;
				border-radius: 5px;
				font-size: 1em;
				box-sizing: border-box;
			}
			.login-container button {
				width: 100%;
			}
		</style>
	</head>
	<body>
		<div class="login-container">
			<h1>Choose Your Display Name</h1>
			<p>Welcome, {{ account_username }}!</p>
			<form method="POST" action="{{ url_for('set_nickname') }}">
				<input
					type="text"
					name="nickname"
					placeholder="Enter your name for this session..."
					required
				/>
				<button type="submit">Enter Chat</button>
			</form>
		</div>
	</body>
</html>
